<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBear 🐻 - AI 말벗 로봇</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
    <style>
        /* Reset CSS */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f7fa;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Header */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #4e89ae;
            text-align: center;
            margin-bottom: 25px;
        }

        /* API Key Input */
        #api-key-input {
            margin-bottom: 15px;
            text-align: center;
        }

        #api-key-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        #api-key-input input {
            width: 100%;
            max-width: 350px;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        #api-key-input input:focus {
            outline: none;
            border-color: #4e89ae;
            box-shadow: 0 0 6px rgba(78, 137, 174, 0.3);
        }

        #api-key-input button {
            padding: 12px 24px;
            background-color: #4e89ae;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #api-key-input button:hover {
            background-color: #3b7197;
        }

        /* Model Selection */
        #model-selection {
            margin-bottom: 25px;
            text-align: center;
        }

        #model-selection label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        #model-selection select{
          width: 100%;
          max-width: 350px;
          padding: 12px 16px;
          border: 1px solid #ced4da;
          border-radius: 10px;
          font-size: 1rem;
          background-color: white;
          appearance: none; /* 기본 스타일 제거 (화살표 등) */
          -webkit-appearance: none; /* Safari, Chrome */
          -moz-appearance: none; /* Firefox */
        }

        /* Chat Area */
        #chat-area {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            height: 400px;
            overflow-y: auto;
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #a8a8a8 #f0f0f0; /* Firefox */
        }
        /* Chrome, Safari */
        #chat-area::-webkit-scrollbar { width: 8px; }
        #chat-area::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        #chat-area::-webkit-scrollbar-thumb { background-color: #a8a8a8; border-radius: 4px; }

        /* Message */
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            clear: both;
            max-width: 80%;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: #e8f5e9;
            color: #388e3c;
            float: left;
            border-bottom-left-radius: 4px;
            position: relative; /* For emotion icon */
        }

        .user-message {
            background-color: #e3f2fd;
            color: #1e88e5;
            float: right;
            border-bottom-right-radius: 4px;
        }
        /* Status and Emotion */
        .status-icon, .emotion-icon {
            position: absolute;
            bottom: -8px;
            font-size: 1.2em;
        }
        .bot-message .emotion-icon {
            left: -8px;
        }

        /* Input Area */
        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-area input:focus {
            outline: none;
            border-color: #4e89ae;
            box-shadow: 0 0 6px rgba(78, 137, 174, 0.3);
        }

        .input-area button {
            padding: 12px 24px;
            background-color: #4e89ae;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        /* Active state for STT button */
        .input-area button.active {
            background-color: #990000; /* Darker red */
        }
        .input-area button:hover {
            background-color: #3b7197;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 15px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            #api-key-input input, #model-selection select {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            #api-key-input button{
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            #chat-area {
                height: 300px;
                padding: 15px;
            }

            .message {
                padding: 10px 14px;
                border-radius: 14px;
                margin-bottom: 8px;
            }

            .input-area {
                flex-direction: column;
            }

            .input-area input {
                margin-bottom: 10px;
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .input-area button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

        }
         /* Very Small Screens (e.g., Smartphones) */
        @media (max-width: 480px) {
            h1 {  font-size: 1.6rem; }
            #api-key-input input, #model-selection select, .input-area input {
                padding: 8px 12px; /* Smaller padding */
                font-size: 0.8rem;
            }

            #api-key-input button, .input-area button{
               padding: 8px 16px;
               font-size: 0.8rem;
            }

            .message {
                padding: 8px 12px; /* Smaller padding */
                font-size: 0.9rem;
            }
        }

        /* Accessibility */
        button:focus,
        input:focus,
        select:focus{
            outline: 2px solid #4e89ae;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CareBear 🐻 - AI 말벗 로봇</h1>

        <div id="api-key-input">
            <label for="api-key">OpenAI API 키를 입력해주세요:</label>
            <input type="password" id="api-key" placeholder="API 키를 입력하세요">
            <button id="api-key-save-btn">저장</button>
        </div>

        <div id="model-selection">
            <label for="model-select">GPT 모델 선택:</label>
            <select id="model-select">
                <option value="gpt-3.5-turbo">GPT-3.5-turbo</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-4-turbo">GPT-4-turbo</option>
            </select>
        </div>

        <div id="chat-area">
            <div class="message bot-message">
                안녕하세요! 저는 CareBear 🐻예요. 무엇을 도와드릴까요? 😊
                <span class="emotion-icon">😊</span>
            </div>
        </div>

        <div class="input-area">
            <button id="start-btn">🎤 말하기</button>
            <input type="text" id="user-input" placeholder="여기에 입력하거나 '말하기' 버튼을 누르세요.">
            <button id="send-btn">전송 🚀</button>
        </div>
    </div>

    <script>
       document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const apiKeyInput = document.getElementById('api-key');
            const apiKeySaveBtn = document.getElementById('api-key-save-btn');
            const chatArea = document.getElementById('chat-area');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const startBtn = document.getElementById('start-btn');
            const modelSelect = document.getElementById('model-select');


            // Load API key from local storage
            let apiKey = localStorage.getItem('openaiApiKey') || '';
            apiKeyInput.value = apiKey;


            // Save API Key to local storage
            apiKeySaveBtn.addEventListener('click', function() {
                apiKey = apiKeyInput.value.trim();
                if (apiKey) {
                    localStorage.setItem('openaiApiKey', apiKey);
                    alert('API 키가 저장되었습니다.');
                } else {
                    alert('API 키를 입력해주세요.');
                }
            });

             // Function to add message to chat area
            function addMessage(message, isUser, emotion = null) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
                let messageText = message;
                if (!isUser && emotion) {
                    messageText += ` <span class="emotion-icon">${emotion}</span>`;
                }
                messageDiv.innerHTML = messageText; // Render emotion icon
                chatArea.appendChild(messageDiv);
                chatArea.scrollTop = chatArea.scrollHeight; // Scroll to bottom
            }

            // Text-to-Speech (TTS) function with improved voice selection
            function speak(text) {
              if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';

                // Find a more natural Korean voice, if available
                const voices = window.speechSynthesis.getVoices();
                let koreanVoice = voices.find(voice => voice.lang === 'ko-KR' && voice.name.includes('Yuna')); // Example: "Yuna"
                if (!koreanVoice) {
                  koreanVoice = voices.find(voice => voice.lang ==='ko-KR');
                }

                if (koreanVoice) {
                  utterance.voice = koreanVoice;
                }

                // Adjust pitch and rate for a more natural sound
                utterance.pitch = 1.1; // Slightly higher pitch (adjust as needed)
                utterance.rate = 0.9; // Slightly slower rate (adjust as needed)

                window.speechSynthesis.speak(utterance);
              } else {
                console.error('Speech synthesis is not supported in this browser.');
              }
            }



            // Get chatbot response from OpenAI API
            async function getChatbotResponse(userMessage) {
                if (!apiKey) {
                    alert("API 키를 먼저 입력하고 저장해주세요.");
                    return { message: "API 키가 없어서 응답할 수 없어요. 😔", emotion: "😔" };
                }

                const selectedModel = modelSelect.value; // Get selected model
                const prompt = `다음은 사용자와의 대화입니다. 친절하고 공감하는 말투로 응답해주세요.  응답에는 현재 대화에서 느껴지는 감정을 이모지로 표현해주세요. 사용자의 메시지: ${userMessage}`;


                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: selectedModel, // Use selected model
                            messages: [
                                {role: "system", content: "당신은 독거 노인을 위한 친절하고 공감 능력이 뛰어난 AI 챗봇입니다."},
                                {role: "user", content: prompt}
                            ],
                            max_tokens: 150
                        })
                    });

                    const data = await response.json();
                    if (data.choices && data.choices.length > 0) {
                         let message = data.choices[0].message.content;

                         // Simple emotion detection
                        let emotion = '🙂';
                        if (message.includes('기뻐') || message.includes('행복')) {
                            emotion = '😄';
                        } else if (message.includes('슬퍼') || message.includes('우울') || message.includes('힘들')) {
                            emotion = '😢';
                        } else if (message.includes('화가') || message.includes('짜증')) {
                            emotion = '😠';
                        } else if (message.includes('놀라') || message.includes('신기')) {
                            emotion = '😲';
                        }
                        return {message, emotion};
                    } else {
                         return { message: "죄송해요, 무슨 말인지 잘 모르겠어요. 😔", emotion: "😔" };
                    }

                } catch (error) {
                    console.error("Error fetching from OpenAI API:", error);
                    return { message: "죄송해요, 지금은 응답할 수 없어요. 나중에 다시 시도해주세요. 😔", emotion: "😔" };                }
            }

            // Event listener for send button
            sendBtn.addEventListener('click', async function() {
                const message = userInput.value.trim();
                if (message) {
                    addMessage(message, true); // Add user message
                    userInput.value = '';  // Clear input

                    const {message: botResponse, emotion} = await getChatbotResponse(message);
                    addMessage(botResponse, false, emotion); // Add bot message
                    speak(botResponse);  // Speak the response
                }
            });

            // Speech Recognition (STT)
            let recognition;
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true; // Keep listening even after pauses
                recognition.lang = 'ko-KR';
                recognition.interimResults = true; // Show interim results
                recognition.maxAlternatives = 1;

                startBtn.addEventListener('click', function() {
                  if (recognition.isRecognizing) { // Check if already recognizing
                    recognition.stop();
                    startBtn.classList.remove('active');
                    startBtn.textContent = '🎤 말하기';
                    sendBtn.click(); // Send the current input
                    return;

                  }
                    try {
                        recognition.start();
                        startBtn.classList.add('active'); // Add active class
                        startBtn.textContent = ' நிறுത്തി 말하기 중지'; // Change button text
                    } catch (error) {
                        console.error("음성 인식 시작 오류:", error);
                    }
                });

                recognition.onresult = function(event) {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    userInput.value = finalTranscript + interimTranscript; // Show both

                };

                recognition.onend = function() {
                  startBtn.classList.remove('active'); // Remove active class
                  startBtn.textContent = '🎤 말하기'; // Change button text back
                    if (userInput.value.trim() !== "") {
                        sendBtn.click(); // Send message when recognition ends.
                    }

                };

                recognition.onerror = function(event) {
                    console.error("음성 인식 오류:", event.error);
                    if (event.error !== 'no-speech') {
                        alert('음성 인식 오류가 발생했습니다. 다시 시도해주세요.');
                    }
                    startBtn.classList.remove('active');
                    startBtn.textContent = '🎤 말하기';
                };
            } else {
                startBtn.disabled = true;
                startBtn.textContent = '🎤 지원 안함';
                alert('브라우저가 음성 인식을 지원하지 않습니다.');
            }

              // Add event listener for Enter key in input field
            userInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    sendBtn.click();
                    event.preventDefault(); // Prevent default behavior (form submission)
                }
            });
        });
    </script>
</body>
</html>
